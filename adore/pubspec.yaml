name: adore
description: Smart Cloth Advisor and Outfit Recommender
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.0
  provider: ^6.1.5
  http: ^1.5.0
  geolocator: ^14.0.2
  image_picker: ^1.2.0
  flutter_image_compress: ^2.4.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  share_plus: ^11.1.0
  uuid: ^4.5.1
  google_fonts: ^6.3.2
  image: ^4.5.4
  permission_handler: ^12.0.1
  table_calendar: ^3.2.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pointer_interceptor: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
  image_path: assets/images/adore_logo.jpg
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: assets/images/adore_logo.jpg

flutter:
  uses-material-design: true
  assets:
    - assets/images/adore_logo.jpg
    - assets/data/countries.json
    - assets/data/products.json
    - assets/data/trends.json
    - assets/data/recommendation_weights.json
